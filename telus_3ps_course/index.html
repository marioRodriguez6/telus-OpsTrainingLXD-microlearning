<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELUS Digital | De-escalating Frustrated Customers</title>
<style>
:root{--navy:#101b3b;--navy2:#1c2c55;--teal:#009fa3;--green:#159b62;--lime:#83c341;--ink:#17233f;--muted:#66728a;--bg:#f3f6fa;--red:#d94747;--redbg:#fff0ef;--greenbg:#eaf8f0;--line:#e1e7ef;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);min-height:100vh}.top{background:var(--navy);color:white;padding:16px clamp(18px,5vw,64px);display:flex;align-items:center;gap:24px}.brand{font-weight:800;letter-spacing:2px;font-size:18px;white-space:nowrap}.brand span{color:#91ce54}.brand small{font-weight:500;letter-spacing:0;font-size:13px;margin-left:6px}.progress-wrap{margin-left:auto;display:flex;align-items:center;gap:12px;width:min(360px,48vw)}.track{height:9px;background:#354363;border-radius:99px;overflow:hidden;flex:1}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#8bd34d);transition:width .3s}.count{font-size:13px;color:#e8edf8;white-space:nowrap}.shell{max-width:1120px;margin:30px auto;padding:0 22px 48px}.panel{background:white;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 36px #18264a0c;overflow:hidden}.welcome{padding:clamp(28px,5vw,58px);background:radial-gradient(circle at 90% 10%,#dff6f1 0,transparent 30%),white}.welcome h1{font-size:clamp(32px,5vw,52px);line-height:1.08;max-width:760px;margin:0 0 18px;color:var(--navy)}.welcome p,.content p{font-size:16px;line-height:1.65;color:var(--muted);max-width:850px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.7px;color:var(--teal);font-weight:800;margin-bottom:12px}.pills{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.pill{padding:10px 15px;border-radius:99px;background:#eaf7f6;color:#087d7e;font-weight:800;font-size:13px}.btn{border:0;border-radius:12px;padding:14px 22px;font-size:15px;font-weight:800;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:10px}.btn:hover{transform:translateY(-1px);filter:brightness(.98)}.primary{background:var(--teal);color:white}.success{background:var(--green);color:white}.retry{background:var(--red);color:white}.secondary{background:#eaf0f6;color:var(--navy)}.content{padding:clamp(22px,4vw,42px)}h2{font-size:clamp(25px,3vw,34px);margin:0 0 12px;color:var(--navy)}h3{color:var(--navy)}.sub{color:var(--muted);line-height:1.6;margin:0 0 24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}.card{border:1px solid var(--line);border-radius:16px;padding:22px;background:#fbfcfe}.card .letter{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--teal)}.card h3{margin:8px 0;font-size:20px}.card p{margin:0;color:var(--muted);line-height:1.55;font-size:15px}.callbox{background:var(--navy);color:white;padding:22px 24px;border-radius:18px;margin:20px 0 26px;display:flex;gap:16px;align-items:flex-start}.avatar-small{width:48px;height:48px;border-radius:50%;background:#dce8ed;display:grid;place-items:center;font-size:25px;flex:none}.callbox .who{font-size:12px;color:#9ee0dc;text-transform:uppercase;letter-spacing:1px;font-weight:800}.callbox blockquote{margin:8px 0 0;font-size:18px;line-height:1.55}.question{font-size:19px;font-weight:800;margin:18px 0}.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;background:white;border:1.5px solid var(--line);padding:18px 20px;border-radius:14px;cursor:pointer;color:var(--ink);font-size:15px;line-height:1.5;display:flex;gap:14px;align-items:flex-start}.answer:hover{border-color:var(--teal);background:#f4fbfb}.key{width:30px;height:30px;border-radius:9px;background:#edf2f7;color:var(--navy);font-weight:900;display:grid;place-items:center;flex:none}.feedback{display:grid;grid-template-columns:minmax(220px,.85fr) 1.15fr;min-height:430px}.portrait{background:#e8eef2;min-height:360px;display:flex;align-items:stretch;justify-content:center;overflow:hidden}.portrait img{width:100%;height:100%;max-height:540px;object-fit:cover;object-position:center 25%}.feedback-copy{padding:clamp(25px,4vw,48px);display:flex;flex-direction:column;justify-content:center}.status{font-weight:900;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}.bad .status{color:var(--red)}.good .status{color:var(--green)}.feedback-copy h2{font-size:clamp(29px,4vw,42px)}.feedback-copy p{color:var(--muted);line-height:1.65;font-size:16px}.reason{background:#f5f7fa;border-radius:14px;padding:16px 18px;margin:12px 0 22px;line-height:1.55}.bad .reason{background:var(--redbg)}.good .reason{background:var(--greenbg)}.reason strong{display:block;margin-bottom:6px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.callout{border-left:4px solid var(--teal);background:#eef9f8;padding:16px 18px;border-radius:0 12px 12px 0;margin:20px 0;line-height:1.6}.dosdonts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.do,.dont{border-radius:15px;padding:18px}.do{background:var(--greenbg)}.dont{background:var(--redbg)}.do h3,.dont h3{margin:0 0 8px}.do ul,.dont ul{padding-left:20px;margin:8px 0;line-height:1.7}.phrase{border:1px solid var(--line);border-radius:14px;padding:17px 18px;margin:12px 0;background:#fff}.phrase p{margin:6px 0 0}.tag{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--teal)}.choice{display:flex;gap:10px;align-items:flex-start;padding:15px;border:1px solid var(--line);border-radius:12px;margin:10px 0;cursor:pointer}.choice:hover{border-color:var(--teal);background:#f5fbfb}.choice input{margin-top:4px;accent-color:var(--teal)}.notice{font-size:13px;color:var(--muted);margin-top:10px}.finish{text-align:center;padding:55px 30px}.finish .check{width:76px;height:76px;border-radius:50%;background:var(--greenbg);color:var(--green);display:grid;place-items:center;font-size:38px;margin:0 auto 22px}.footer{display:flex;justify-content:space-between;gap:14px;color:#8791a3;font-size:12px;margin-top:18px}.hidden{display:none!important}.time{display:inline-block;background:#eef3f8;color:#52617a;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800;margin-bottom:16px}
@media(max-width:700px){.cards,.dosdonts{grid-template-columns:1fr}.feedback{grid-template-columns:1fr}.portrait{max-height:300px;min-height:260px}.portrait img{max-height:300px;object-position:center 30%}.top{padding:14px 18px}.brand{font-size:15px}.progress-wrap{width:45vw}.shell{margin:20px auto}.callbox blockquote{font-size:16px}}
</style></head><body>
<header class="top"><div class="brand"><span>✳</span> TELUS <small>Digital</small></div><div class="progress-wrap"><div class="track"><div class="fill" id="progress"></div></div><div class="count" id="count">START</div></div></header>
<main class="shell"><div id="app" class="panel"></div><div class="footer"><span>Customer Support Learning • 3 P's Framework</span><span>15-minute self-paced learning experience</span></div></main>
<script>
const scenarios=[
{title:'The repeated outage',skill:'PAUSE',customer:'I have contacted support twice already, and nobody has fixed this issue. Your software keeps crashing, and I am losing time because of it. Why does this keep happening?',prompt:'What should you do first?',a:'Let me stop you there. I need you to follow the troubleshooting steps so we can identify the issue.',b:'I can hear how frustrating this has been. I am listening, and I want to understand what has happened.',correct:'b',badTitle:'You moved too quickly',bad:'Interrupting and directing the customer straight to troubleshooting can make them feel unheard. You have not yet understood the impact of the repeated failures.',badTip:'PAUSE: allow the customer to finish, listen without interrupting, and keep your tone calm.',goodTitle:'You made space to listen',good:'You gave the customer room to explain and signaled that you are ready to understand before acting.',goodTip:'PAUSE: listening first can reduce tension and creates a better starting point for problem-solving.'},
{title:'The delayed response',skill:'PARAPHRASE',customer:'I sent the report yesterday and still have not received an update. I have a deadline, and nobody seems to care that I am waiting.',prompt:'Which response best acknowledges the concern?',a:'We have a lot of requests at the moment. You will need to wait for an update.',b:'You have a deadline approaching, and not receiving an update has left you uncertain. I can understand why that is frustrating.',correct:'b',badTitle:'The response sounded dismissive',bad:'Mentioning workload and telling the customer to wait focuses on the process rather than their concern. It does not acknowledge the pressure they are experiencing.',badTip:'PARAPHRASE: reflect the facts and impact in your own words, without making excuses or promises you cannot keep.',goodTitle:'You showed the customer you understood',good:'You reflected the deadline and uncertainty behind the complaint. The customer can hear that you understood more than just the missing update.',goodTip:'PARAPHRASE: specific acknowledgment feels more genuine than a generic “I understand.”'},
{title:'The unclear error',skill:'PROBE',customer:'It keeps giving me an error whenever I try to submit the form. I do not know what else to do.',prompt:'What is the most useful next question?',a:'Could you tell me what you were doing just before the error appeared and what the message said?',b:'Have you tried clearing your cache? That usually fixes these things.',correct:'a',badTitle:'You assumed the cause too early',bad:'Clearing the cache might eventually be relevant, but suggesting it immediately assumes a solution before you have gathered enough detail.',badTip:'PROBE: ask an open-ended question that helps you understand what happened, when it happened, and what the customer saw.',goodTitle:'You asked a useful open question',good:'Your question invites the customer to describe the steps and error message. That gives you evidence to guide the next troubleshooting action.',goodTip:'PROBE: gather context before making assumptions or recommending a fix.'},
{title:'The customer has lost confidence',skill:'INTEGRATE THE 3 P’S',customer:'Honestly, I am tired of repeating myself. I have explained this three times. I just need someone to take responsibility and help me.',prompt:'Choose the response that best combines all three techniques.',a:'I need you to calm down so I can help. Start by explaining the issue again from the beginning.',b:'I can hear how exhausting it has been to repeat this. I will take time to understand what has happened. Could you tell me what remains unresolved so I can focus on the next step?',correct:'b',badTitle:'The response risks escalating tension',bad:'Telling a customer to calm down can sound blaming. Asking them to repeat everything without acknowledging their experience can reinforce the feeling that nobody has listened.',badTip:'Combine the 3 P’s: pause and listen, paraphrase the impact, then probe for the information you still need.',goodTitle:'You brought the 3 P’s together',good:'You acknowledged the customer’s experience, showed that you would listen, and asked a focused open-ended question to identify what remains unresolved.',goodTip:'The 3 P’s help customers feel heard while you gather the details needed to move toward a solution.'},
{title:'The customer has lost confidence — next step',skill:'FOLLOW THROUGH',customer:'I can explain it again, but I do not want to go through the same steps if nobody is going to follow up.',prompt:'What is the best way to build confidence while moving forward?',a:'I cannot guarantee anything. You will just have to wait and see what happens.',b:'I understand why you are hesitant. I will explain the next step, confirm what I can do, and make sure you know how and when you will receive an update.',correct:'b',badTitle:'You left the customer without a clear next step',bad:'A vague response can reinforce the customer’s concern that nobody is taking ownership. Avoid making guarantees, but do explain what you can do and what happens next.',badTip:'Be transparent: clarify the next action, your role, and any realistic update expectations.',goodTitle:'You helped rebuild confidence',good:'You acknowledged the customer’s hesitation and offered a clear, realistic next step without promising an outcome you cannot control.',goodTip:'A helpful close explains what will happen next, who is responsible, and when the customer can expect an update.'}
];
let page='welcome',scenario=0,selected='',score=0,languageChoice=null;const app=document.getElementById('app');
const order=['welcome','objectives','frustration','active','framework','pause','paraphrase','probe','scenarioIntro','question','feedback','language','languageFeedback','takeaways','complete'];
function progress(){let n=order.indexOf(page);let pct=page==='complete'?100:Math.max(0,(n/(order.length-1))*100);document.getElementById('progress').style.width=pct+'%';document.getElementById('count').textContent=page==='welcome'?'START':page==='complete'?'COMPLETE':`SECTION ${Math.min(n+1,14)} / 14`}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function continueScenario(){scenario++;if(scenario<scenarios.length)go('question');else go('language')}
function render(){progress();
if(page==='welcome'){app.innerHTML=`<section class="welcome"><div class="eyebrow">TELUS Digital • Customer Support Learning</div><span class="time">15 minutes • Self-paced</span><h1>De-escalating Frustrated Customers</h1><p>Strong support is more than solving a technical issue. It is also how you make customers feel while you work toward a solution. Learn a practical approach, then apply it in realistic conversations.</p><div class="pills"><span class="pill">PAUSE</span><span class="pill">PARAPHRASE</span><span class="pill">PROBE</span></div><button class="btn primary" onclick="go('objectives')">Start learning →</button></section>`}
else if(page==='objectives'){app.innerHTML=`<section class="content"><div class="eyebrow">01 • Your learning goals</div><span class="time">1 minute</span><h2>What you will be able to do</h2><p class="sub">By the end of this course, you will practice how to:</p><div class="cards"><article class="card"><div class="letter">OBJECTIVE 1 • APPLY</div><h3>Use active de-escalation</h3><p>Demonstrate active listening and empathetic phrasing to select appropriate responses in at least 4 out of 5 decision checks.</p></article><article class="card"><div class="letter">OBJECTIVE 2 • APPLY</div><h3>Use the 3 P’s under pressure</h3><p>Apply Pause, Paraphrase, and Probe across customer complaint scenarios.</p></article><article class="card"><div class="letter">OBJECTIVE 3 • EVALUATE</div><h3>Self-correct your communication</h3><p>Recognize robotic or dismissive language and replace it with a more empathetic alternative.</p></article></div><div class="callout"><strong>How to use this course:</strong> First, learn the communication techniques. Then practice with four customer scenarios and finish by reviewing sample phrases.</div><button class="btn primary" onclick="go('frustration')">Continue →</button></section>`}
else if(page==='frustration'){app.innerHTML=`<section class="content"><div class="eyebrow">02 • Understand the customer</div><span class="time">1 minute</span><h2>What is happening when a customer is frustrated?</h2><p class="sub">Anger is often a reaction to an unresolved problem, repeated effort, uncertainty, or the impact an issue has on someone's work. The customer may be worried about lost time, missed deadlines, or having to explain the same issue again.</p><div class="cards"><article class="card"><div class="letter">REPEATED EFFORT</div><h3>“I already called twice.”</h3><p>They feel they have invested time without getting closer to a resolution.</p></article><article class="card"><div class="letter">LOSS OF CONTROL</div><h3>“I cannot finish my work.”</h3><p>The issue is affecting something important to them.</p></article><article class="card"><div class="letter">LOW CONFIDENCE</div><h3>“Nobody is listening.”</h3><p>Previous interactions may have weakened their trust in support.</p></article></div><div class="callout"><strong>Remember:</strong> Do not take the customer's frustration personally. Focus on the problem, the impact, and what you can do next within your role.</div><button class="btn primary" onclick="go('active')">Next: How to respond →</button></section>`}
else if(page==='active'){app.innerHTML=`<section class="content"><div class="eyebrow">03 • Active listening and empathy</div><span class="time">1 minute</span><h2>Make the customer feel heard</h2><p class="sub">Active listening means giving the customer your attention, understanding both the issue and its impact, and responding in a way that shows you have understood. Empathy does not mean agreeing with everything or promising an outcome you cannot guarantee.</p><div class="dosdonts"><div class="do"><h3>✓ Do</h3><ul><li>Let the customer finish speaking.</li><li>Use a calm, respectful tone.</li><li>Acknowledge the impact of the issue.</li><li>Ask focused questions before troubleshooting.</li><li>Explain the next step clearly.</li></ul></div><div class="dont"><h3>✕ Avoid</h3><ul><li>Interrupting or speaking over them.</li><li>Blaming the customer or another team.</li><li>Using “calm down” or “that is not my department.”</li><li>Repeating scripts without responding to their concern.</li><li>Making promises you cannot keep.</li></ul></div></div><div class="callout"><strong>Empathy sounds specific:</strong> “I can understand why this is frustrating, especially when it has interrupted your work.” This is more meaningful than saying only “I understand.”</div><button class="btn primary" onclick="go('framework')">Learn the 3 P’s →</button></section>`}
else if(page==='framework'){app.innerHTML=`<section class="content"><div class="eyebrow">04 • A simple framework</div><span class="time">30 seconds</span><h2>Use the 3 P’s before jumping to a solution</h2><p class="sub">The 3 P’s give you a repeatable structure for difficult conversations. They are not a script; adapt your words to the customer's situation.</p><div class="cards"><article class="card"><div class="letter">01 • PAUSE</div><h3>Listen first</h3><p>Give the customer space. Stay calm, avoid interrupting, and do not become defensive.</p></article><article class="card"><div class="letter">02 • PARAPHRASE</div><h3>Show understanding</h3><p>Reflect the concern and its impact in your own words. Acknowledge the customer's frustration.</p></article><article class="card"><div class="letter">03 • PROBE</div><h3>Understand more</h3><p>Ask open-ended questions to clarify what happened before choosing the next step.</p></article></div><button class="btn primary" onclick="go('pause')">Explore each P →</button></section>`}
else if(page==='pause'){app.innerHTML=`<section class="content"><div class="eyebrow">05 • The first P</div><span class="time">30 seconds</span><h2>PAUSE: slow the conversation down</h2><p class="sub">When a customer is upset, your first job is not to defend the process or rush into a fix. Give them time to explain. Listen for the facts, the emotion, and the impact.</p><div class="phrase"><span class="tag">Try saying</span><p>“I am listening. Please tell me what has been happening.”</p></div><div class="phrase"><span class="tag">Avoid saying</span><p>“Let me stop you there. I already know what the problem is.”</p></div><div class="callout"><strong>Quick reminder:</strong> A pause is not silence for its own sake. It is a deliberate moment to listen, regulate your response, and understand before acting.</div><button class="btn primary" onclick="go('paraphrase')">Next: Paraphrase →</button></section>`}
else if(page==='paraphrase'){app.innerHTML=`<section class="content"><div class="eyebrow">06 • The second P</div><span class="time">30 seconds</span><h2>PARAPHRASE: reflect what matters</h2><p class="sub">Restate the customer's concern in your own words. Include the practical impact when it is clear. Avoid sounding like you are repeating a script or minimizing their experience.</p><div class="phrase"><span class="tag">Try saying</span><p>“So the crashes are preventing you from uploading reports, and you have already spent time contacting support. I can see why that is frustrating.”</p></div><div class="phrase"><span class="tag">Avoid saying</span><p>“I understand, but these things happen.”</p></div><div class="callout"><strong>Quick reminder:</strong> A useful paraphrase is specific. It shows the customer which part of their concern you heard.</div><button class="btn primary" onclick="go('probe')">Next: Probe →</button></section>`}
else if(page==='probe'){app.innerHTML=`<section class="content"><div class="eyebrow">07 • The third P</div><span class="time">30 seconds</span><h2>PROBE: ask before assuming</h2><p class="sub">Use open-ended questions to understand the situation. Ask one question at a time, listen to the answer, and then decide what information you still need.</p><div class="phrase"><span class="tag">Try asking</span><p>“Could you walk me through what happens when you try to upload the report?”</p></div><div class="phrase"><span class="tag">Avoid asking too soon</span><p>“You restarted your computer, right?”</p></div><div class="callout"><strong>Quick reminder:</strong> Probe to understand, not to interrogate. Explain why you need information and keep questions relevant.</div><button class="btn primary" onclick="go('scenarioIntro')">Ready to practice →</button></section>`}
else if(page==='scenarioIntro'){app.innerHTML=`<section class="content"><div class="eyebrow">08 • Guided practice</div><span class="time">6 minutes</span><h2>Now put the 3 P’s into practice</h2><p class="sub">You will work through four customer situations. Each choice leads to a dedicated feedback screen.</p><div class="callbox"><div class="avatar-small">👩🏻</div><div><div class="who">Customer support simulation</div><blockquote>Customers may be upset for different reasons. Your goal is to listen, acknowledge their experience, and understand what is needed before moving toward a solution.</blockquote></div></div><div class="callout"><strong>How feedback works:</strong> An ineffective response shows why it may increase frustration and lets you try again. An effective response explains what you did well and lets you continue.</div><button class="btn primary" onclick="go('question')">Begin scenario 1 →</button></section>`}
else if(page==='question'){let s=scenarios[scenario];app.innerHTML=`<section class="content"><div class="eyebrow">${scenario<3?`Scenario ${scenario+1} of 4`:'Scenario 4 of 4 • Decision '+(scenario+1)+' of 5'} • ${s.skill}</div><span class="time">Practice decision</span><h2>${s.title}</h2><div class="callbox"><div class="avatar-small">👩🏻</div><div><div class="who">Customer • Live call • Connected</div><blockquote>“${s.customer}”</blockquote></div></div><div class="question">${s.prompt}</div><div class="answers"><button class="answer" onclick="choose('a')"><span class="key">A</span><span>${s.a}</span></button><button class="answer" onclick="choose('b')"><span class="key">B</span><span>${s.b}</span></button></div><p class="notice">Choose the response you would use in a real customer conversation.</p></section>`}
else if(page==='feedback'){let s=scenarios[scenario],ok=selected===s.correct;app.innerHTML=`<section class="feedback ${ok?'good':'bad'}"><div class="portrait"><img src="assets/${ok?'customer-happy.png':'customer-frustrated.png'}" alt="${ok?'A relieved, happy customer':'A frustrated customer'}"></div><div class="feedback-copy"><div class="status">${ok?'✓ Effective response':'! A chance to improve'}</div><h2>${ok?s.goodTitle:s.badTitle}</h2><p>${ok?s.good:s.bad}</p><div class="reason"><strong>${ok?'Why this works':'What to remember'}</strong><span>${ok?s.goodTip:s.badTip}</span></div><div class="actions">${ok?'<button class="btn success" onclick="continueScenario()">Continue →</button>':'<button class="btn retry" onclick="go(\'question\')">↻ Try again</button>'}</div></div></section>`}
else if(page==='language'){app.innerHTML=`<section class="content"><div class="eyebrow">09 • Evaluate and self-correct</div><span class="time">1 minute</span><h2>Spot robotic or dismissive language</h2><p class="sub">Review the phrases below. Select the two that are most likely to make a frustrated customer feel dismissed.</p><label class="choice"><input type="checkbox" name="phrase" value="1"><span>“That is our policy. There is nothing I can do.”</span></label><label class="choice"><input type="checkbox" name="phrase" value="2"><span>“I can see how this delay is affecting your work. Let me check what options are available.”</span></label><label class="choice"><input type="checkbox" name="phrase" value="3"><span>“You will have to wait like everyone else.”</span></label><label class="choice"><input type="checkbox" name="phrase" value="4"><span>“Could you tell me what happens when the error appears?”</span></label><p class="notice">Select two phrases, then check your answer.</p><button class="btn primary" onclick="checkLanguage()">Check my choices →</button></section>`}
else if(page==='languageFeedback'){let ok=languageChoice;app.innerHTML=`<section class="content"><div class="eyebrow">Communication self-check</div><h2>${ok?'Good evaluation':'Review and try again'}</h2><p class="sub">${ok?'You identified the two phrases that sound dismissive.':'Look for language that shuts down the conversation, shifts responsibility, or tells the customer to simply wait.'}</p><div class="dosdonts"><div class="dont"><h3>Dismissive</h3><p>“That is our policy. There is nothing I can do.”</p><p>“You will have to wait like everyone else.”</p></div><div class="do"><h3>More empathetic alternatives</h3><p>“Let me explain what I can do next and check the options available.”</p><p>“I understand the wait is frustrating. I will check the current status and update you on the next step.”</p></div></div><div class="callout"><strong>Self-correction habit:</strong> Notice when a phrase sounds scripted, blaming, or final. Replace it with acknowledgment, clear ownership within your role, and a helpful next step.</div><button class="btn primary" onclick="${ok?'go(\'takeaways\')':'go(\'language\')'}">${ok?'Continue to key takeaways →':'Try again'}</button></section>`}
else if(page==='takeaways'){app.innerHTML=`<section class="content"><div class="eyebrow">10 • Key takeaways</div><span class="time">1 minute</span><h2>Take the 3 P’s into your next call</h2><div class="cards"><article class="card"><div class="letter">PAUSE</div><h3>Listen first</h3><p>Give the customer space to explain. Stay calm and avoid interrupting.</p></article><article class="card"><div class="letter">PARAPHRASE</div><h3>Show understanding</h3><p>Acknowledge the concern and reflect its impact in your own words.</p></article><article class="card"><div class="letter">PROBE</div><h3>Understand more</h3><p>Ask open-ended questions before deciding on the next step.</p></article></div><div class="callout"><strong>Remember:</strong> Customers need to feel heard before they can feel confident in the solution. Be genuine, avoid robotic language, and explain what you can do next.</div><button class="btn primary" onclick="go('complete')">Complete course →</button></section>`}
else if(page==='complete'){app.innerHTML=`<section class="finish"><div class="check">✓</div><div class="eyebrow">Course complete</div><h2>You practiced the 3 P’s</h2><p class="sub" style="margin:12px auto 26px">Pause to listen. Paraphrase to show understanding. Probe to learn more. Use empathetic, natural language in your next difficult customer interaction.</p><p class="sub">You completed four customer scenarios, five decision checks, and a communication self-check.</p><button class="btn secondary" onclick="restart()">Review the course ↻</button></section>`}
}
